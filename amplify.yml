# AWS Amplify Hosting — static Next.js export (output: 'export' → /out)
# Keep platform WEB (static). If Amplify picks SSR/WEB_COMPUTE:
#   aws amplify update-app --app-id <APP_ID> --platform WEB --region eu-central-1
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - node -v
        - npm ci --no-audit
    build:
      commands:
        - npm run build
        - test -f out/index.html
        - test -f out/404.html
        - test -f out/sitemap.xml
        - test -f out/robots.txt
        - test -f out/services.html -o -d out/services
        - test -f out/about.html -o -d out/about
        - test -f out/contact.html -o -d out/contact
        - test -f out/privacy.html -o -d out/privacy
        - test -f out/terms.html -o -d out/terms
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
