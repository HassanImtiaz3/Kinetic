# Build static export and publish to the `cpanel` branch.
# cPanel Git Version Control deploys that branch into public_html
# (FTP/SFTP from GitHub Actions is blocked on this host).
#
# Required GitHub secret:
#   SITE_URL — e.g. https://kineticenterprise.com.pk
#
# One-time cPanel setup (see README):
#   Git Version Control → clone this repo → deploy branch `cpanel`

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "Missing secret SITE_URL (e.g. https://kineticenterprise.com.pk)"
            exit 1
          fi
          npm run build
          test -f out/index.html
          test -f out/404.html
          test -f out/.cpanel.yml

      - name: Publish out/ to cpanel branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: cpanel
          # Keep linear history so cPanel Git can fast-forward on Update.
          # force_orphan rewrites history every deploy and causes:
          # "Not possible to fast-forward, aborting."
          force_orphan: false
          force: false
          commit_message: 'Deploy static site'
